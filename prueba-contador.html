<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Prueba contador</title>
<style>
body{margin:0;background:#5b4a3a;font-family:Inter,system-ui,sans-serif;padding:40px 24px;color:#fbf8f3}
.caja{display:inline-flex;align-items:center;gap:14px;background:rgba(251,248,243,.12);border:1px solid rgba(251,248,243,.25);border-radius:14px;padding:12px 16px}
.odo{display:inline-flex;gap:6px}
.fl{position:relative;width:44px;height:60px;font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;font-weight:700;font-size:36px;color:#f7f1e7;-webkit-perspective:220px;perspective:220px;border-radius:7px;box-shadow:0 2px 0 #120e0b;font-variant-numeric:tabular-nums}
.fl::after{content:"";position:absolute;left:0;right:0;top:29.5px;height:1px;background:#0e0b09;z-index:5}
.h{position:absolute;left:0;right:0;height:30px;overflow:hidden}
.h span{position:absolute;left:0;right:0;height:60px;display:flex;align-items:center;justify-content:center;line-height:1}
.t span{top:0}.b span{top:-30px}
.t{top:0;border-radius:7px 7px 0 0;background:#352c27}
.b{top:30px;border-radius:0 0 7px 7px;background:#2a2420}
.ft,.fb{visibility:hidden;z-index:3;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.ft{transform-origin:50% 100%}.fb{transform-origin:50% 0;transform:rotateX(90deg)}
.go .ft,.go .fb{visibility:visible}
.go .ft{animation:caeA .17s ease-in forwards}.go .fb{animation:caeB .17s .17s ease-out forwards}
@keyframes caeA{from{transform:rotateX(0)}to{transform:rotateX(-90deg)}}
@keyframes caeB{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
button{margin-top:20px;padding:8px 14px;border-radius:99px;border:0;cursor:pointer}
</style></head><body>
<p>Página de prueba del contador (no cuenta visitas).</p>
<div class="caja"><div class="odo" id="odo"></div><div style="font:italic 15px/1.3 Georgia,serif">vecinos han pasado<br>ya por el huerto</div></div>
<div><button id="mas">Sumar una visita</button> <button id="re">Repetir la carga</button></div>
<script>
const odo=document.getElementById('odo');const digs=[];
function mk(){const f=document.createElement('div');f.className='fl';f.innerHTML='<div class="h t"><span>0</span></div><div class="h b"><span>0</span></div><div class="h t ft"><span>0</span></div><div class="h b fb"><span>0</span></div>';odo.appendChild(f);return {f,v:0,q:[],busy:false}}
for(let i=0;i<4;i++)digs.push(mk());
function step(d){if(!d.q.length){d.busy=false;return}d.busy=true;const nv=d.q.shift();const s=d.f.querySelectorAll('span');s[0].textContent=nv;s[1].textContent=d.v;s[2].textContent=d.v;s[3].textContent=nv;d.f.classList.remove('go');void d.f.offsetWidth;d.f.classList.add('go');setTimeout(()=>{s[1].textContent=nv;d.v=nv;d.f.classList.remove('go');step(d)},360)}
function goTo(d,t){let c=d.q.length?d.q[d.q.length-1]:d.v;while(c!==t){c=(c+1)%10;d.q.push(c)}if(!d.busy)step(d)}
let n=0;function pinta(v){const s=String(v).padStart(4,'0').slice(-4);digs.forEach((d,i)=>setTimeout(()=>goTo(d,+s[i]),i*120))}
function reset(){digs.forEach(d=>{d.q=[];d.v=0;d.f.classList.remove('go');d.f.querySelectorAll('span').forEach(x=>x.textContent=0)});setTimeout(()=>{n=130;pinta(n)},500)}
reset();
document.getElementById('mas').onclick=()=>{n++;pinta(n)};
document.getElementById('re').onclick=reset;
</script></body></html>
